# =============================================================================
# 3D-print catalog — the ONLY file you edit by hand.
#
# After editing, run the sync (locally `npm run catalog:sync`, or GitHub →
# Actions → "Sync catalog" → Run workflow). The sync writes
# catalog/data.generated.json and public/catalogo/img/ — never edit those.
# Full guide: CATALOG.md
# =============================================================================

# -----------------------------------------------------------------------------
# contact — where "Solicitar este modelo" sends customers.
# -----------------------------------------------------------------------------
contact:
  # WhatsApp number in international format, digits only (52 = Mexico).
  whatsapp: '523313404076'
  email: 'contact@josueds.me'

  # Message templates (Spanish). Placeholders:
  #   {name} → model name (after overrides)
  #   {link} → deep link to that model, e.g. https://josh-3d-lab.github.io/catalogo/#m-123456
  whatsapp_message: '¡Hola! Me interesa el modelo {name} ({link}). ¿Me podrías dar más información?'
  # Used by the home page's "Escríbeme por WhatsApp" button (no placeholders).
  whatsapp_general_message: '¡Hola! Vi el catálogo de Josh 3D Lab y me gustaría pedir una pieza impresa en 3D.'
  email_subject: 'Solicitud de modelo: {name}'
  email_body: |-
    ¡Hola!

    Me interesa el modelo {name} ({link}).
    ¿Me podrías dar más información sobre tamaño, colores y tiempo de entrega?

    Gracias.

# -----------------------------------------------------------------------------
# collections — one section per entry, in this order on the page.
#
#   url          MakerWorld collection URL. For your reference only (MakerWorld
#                blocks scripted reads of collections, see CATALOG.md).
#   name         Section title shown on the page (Spanish). Required.
#   description  Optional short text under the title (Spanish).
#   models       Models in display order. Each item is a MakerWorld model URL
#                (https://makerworld.com/en/models/123456-whatever) or just its
#                numeric ID (123456). A trailing "# comment" is ignored — handy
#                for remembering what each ID is.
#
# Example entry to copy:
#
#   - url: https://makerworld.com/en/collections/12345678-my-collection
#     name: Mi colección
#     description: Texto opcional.
#     models:
#       - https://makerworld.com/en/models/1234567-some-model
#       - 7654321 # Another model
# -----------------------------------------------------------------------------
